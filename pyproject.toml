[project]
name = "rubin-rucio-policy"
version = "0.1.0"
description = "Rucio Policy Package for rubin"
authors = [
    { name="Dennis Lee", email="dylee@fnal.gov" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
   "Programming Language :: Python :: 3",
   "Operating System :: OS Independent",
]
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "rucio>=35.5.0"
]
